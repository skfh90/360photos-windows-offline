// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 26
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "23.1.7779620"
    // if (System.properties['os.arch'] == "aarch64") {
        //     // For M1 Users we need to use the NDK 24 which added support for aarch64
        //     ndkVersion = "24.0.8215888"
        // } else {
        //     // Otherwise we default to the side-by-side NDK version from AGP.
        //     ndkVersion = "21.4.7075529"
        // }             
        kotlin_version="1.6.20"   
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.22")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    // Pin to the version bundled in node_modules/react-native-background-fetch/android/libs;
    // '+' would pick tsbackgroundfetch 4.x, whose newer deps AGP 7.4's D8 cannot dex.
    configurations.all {
        resolutionStrategy.force 'com.transistorsoft:tsbackgroundfetch:1.0.2'
    }
    repositories {
        mavenCentral()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
            url("${project(':react-native-background-fetch').projectDir}/libs")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        maven { url 'https://www.jitpack.io' }
    }

    ext {
        OrientationAngle_compileSdkVersion = 34
        OrientationAngle_targetSdkVersion = 34
        ReactNativeWebView_kotlinVersion = "1.6.20"
    }
}
